name: check

# Validates only — deploys are a manual `git push` to Pages.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.22"
          args: --version

      - run: npm ci

      - run: ./scripts/check.sh
